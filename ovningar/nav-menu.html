<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <style>
        nav ul {
        list-style-type: none; /* Tar bort punkterna */
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #333;
        }

        nav li {
        float: left; /* Eller display: inline-block; */
        }

        nav li a {
        display: block;
        color: white;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
        }

        nav li a:hover {
        background-color: #9b580d;
        }
    </style>
</head>
<body>
<nav>
    <ul>
        <li><a href="#">Menu1</a></li>
        <li><a href="#">Menu2</a></li>
        <li><a href="#">Menu3</a></li>
    </ul>
</nav>
</body>
</html>
